[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "aovguard"
version = "1.2.1"
description = "EXR structure inspection and configurable AOV validation for VFX pipelines."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { file = "LICENSE" }
authors = [
  { name = "Joshua A. Medina G." },
]
keywords = ["exr", "aov", "vfx", "rendering", "pipeline", "validation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Environment :: X11 Applications :: Qt",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "numpy>=2.0",
  "opencv-python>=4.8",
  "OpenEXR>=3.2.4",
  "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=6.0",
  "ruff>=0.8",
]

[project.scripts]
aovguard = "aovguard.cli:main"
aovguard-ui = "aovguard.ui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=aovguard --cov-branch --cov-report=term-missing"

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
files = ["src/aovguard"]
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = [
  ".uv-cache",
  ".venv",
  ".venv_verify",
  "dist",
  "verification_*",
]

[tool.ruff.lint]
select = [
  "D100",
  "D101",
  "D102",
  "D103",
  "D104",
  "D107",
  "E4",
  "E7",
  "E9",
  "F",
  "I",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D"]

[tool.hatch.build.targets.wheel]
packages = ["src/aovguard"]
