preset = "lighting_delivery"

# Optional renderer- or studio-specific semantic classifications.
# Names are matched case-insensitively.
[aov_categories]
# Cryptomatte layers are detected automatically from EXR metadata; use an
# explicit category only for nonstandard files without that metadata.
# crypto_asset = "cryptomatte"
# custom_depth = "depth"
# vendor_payload = "ignored" # Explicit choice; channels remain visible for integrity checks.

[rules.unknown_aov]
enabled = true
severity = "warning"

[rules.nan_inf]
enabled = true
severity = "error"
supported_aov_types = ["color", "scalar", "vector", "mask", "depth", "cryptomatte", "unknown", "ignored"]

[rules.empty_aov]
enabled = true
severity = "warning"
supported_aov_types = ["color"]

[rules.empty_aov.parameters]
max_luminance = 0.00001
max_average = 0.000001

[rules.near_empty_aov]
enabled = true
severity = "warning"
supported_aov_types = ["color"]

[rules.near_empty_aov.parameters]
max_ratio = 0.02
max_average = 0.001
empty_max_luminance = 0.00001

[rules.missing_aov]
enabled = false
severity = "error"

[rules.missing_aov.parameters]
required = ["diffuse", "specular", "emission"]

[rules.missing_channels]
enabled = false
severity = "error"

[rules.missing_channels.parameters]
required = ["R", "G", "B"]

[rules.negative_values]
enabled = false
severity = "warning"
supported_aov_types = ["color", "scalar", "vector", "mask", "depth", "unknown"]

[rules.extreme_values]
enabled = false
severity = "warning"
supported_aov_types = ["color", "scalar", "vector", "mask", "depth", "unknown", "ignored"]

[rules.extreme_values.parameters]
max_absolute = 1000000.0

[rules.constant_channel]
enabled = false
severity = "info"
supported_aov_types = ["color"]

[rules.constant_channel.parameters]
tolerance = 0.0
skip_empty_aovs = true
empty_max_luminance = 0.00001

[rules.resolution_mismatch]
enabled = true
severity = "error"

# Opt-in project policy, not automatic renderer-specific semantics.
# Targets are EXACT case-sensitive inspected names; quote multipart keys such
# as "[part:left]::Z". Every component is checked. Adapt names/units first.
[rules.technical_range]
enabled = false
severity = "warning"

[rules.technical_range.parameters.ranges.Z]
min = 0.0
# max = 10000.0 # Set only when the project's depth units/range are known.
tolerance = 0.0

# Add a real mask AOV name, classified with [aov_categories] if necessary:
# [rules.technical_range.parameters.ranges.matte]
# min = 0.0
# max = 1.0
# tolerance = 0.000001

[rules.aov_structure_mismatch]
enabled = true
severity = "error"
